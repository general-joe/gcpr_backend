name: Deploy Backend to EC2

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            export PATH="$HOME/.local/share/pnpm:$PATH"

            cd /home/ubuntu/gcpr_backend

            echo "========================================"
            echo "SYSTEM INFORMATION"
            echo "========================================"

            echo "Node:"
            node -v

            echo "PNPM:"
            pnpm -v

            echo "PM2:"
            pm2 -v

            echo ""
            echo "========================================"
            echo "DISK BEFORE CLEANUP"
            echo "========================================"

            df -h /

            echo ""
            echo "Disk usage by top-level directories:"
            sudo du -xhd1 / 2>/dev/null | sort -h || true

            # Get available disk space in KB
            AVAILABLE_KB=$(df -Pk / | awk 'NR==2 {print $4}')

            echo ""
            echo "Available disk: ${AVAILABLE_KB} KB"

            echo ""
            echo "========================================"
            echo "EMERGENCY DISK CLEANUP"
            echo "========================================"

            # If less than 1 GB is available, perform cleanup.
            if [ "$AVAILABLE_KB" -lt 1048576 ]; then

              echo "WARNING: Less than 1 GB of disk space available."
              echo "Running safe cleanup operations..."

              echo ""
              echo "--- Cleaning APT cache ---"
              sudo apt clean || true
              sudo apt autoclean || true

              echo ""
              echo "--- Cleaning old system journals ---"
              sudo journalctl --vacuum-time=3d || true
              sudo journalctl --vacuum-size=100M || true

              echo ""
              echo "--- Cleaning pnpm store ---"
              pnpm store prune || true

              echo ""
              echo "--- Docker disk usage before cleanup ---"
              docker system df || true

              echo ""
              echo "--- Removing unused Docker images ---"
              docker image prune -af || true

              echo ""
              echo "--- Removing unused Docker build cache ---"
              docker builder prune -af || true

            else
              echo "More than 1 GB available. No emergency cleanup required."
            fi

            echo ""
            echo "========================================"
            echo "DISK AFTER CLEANUP"
            echo "========================================"

            df -h /

            AVAILABLE_KB=$(df -Pk / | awk 'NR==2 {print $4}')

            echo ""
            echo "Available disk after cleanup: ${AVAILABLE_KB} KB"

            # Require at least 512 MB before continuing.
            if [ "$AVAILABLE_KB" -lt 524288 ]; then
              echo ""
              echo "========================================"
              echo "DEPLOYMENT ABORTED"
              echo "========================================"
              echo "ERROR: Less than 512 MB of disk space is available."
              echo "The server needs additional disk space."
              exit 1
            fi

            echo ""
            echo "========================================"
            echo "UPDATING BACKEND"
            echo "========================================"

            git fetch origin production
            git checkout production
            git reset --hard origin/production

            echo ""
            echo "========================================"
            echo "INSTALLING DEPENDENCIES"
            echo "========================================"

            pnpm install --frozen-lockfile

            echo ""
            echo "========================================"
            echo "RUNNING DATABASE MIGRATIONS"
            echo "========================================"

            pnpm run migrate:deploy

            echo ""
            echo "========================================"
            echo "RESTARTING BACKEND"
            echo "========================================"

            pm2 restart gcpr-backend --update-env

            echo ""
            echo "========================================"
            echo "CLEANING PNPM STORE"
            echo "========================================"

            pnpm store prune || true

            echo ""
            echo "========================================"
            echo "DEPLOYMENT COMPLETED"
            echo "========================================"

            echo "Disk after deployment:"
            df -h /