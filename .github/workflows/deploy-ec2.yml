name: Deploy Backend to EC2

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            export PATH="$HOME/.local/share/pnpm:$PATH"

            cd /home/ubuntu/gcpr_backend

            echo "========================================"
            echo "SYSTEM INFORMATION"
            echo "========================================"

            echo "Node:"
            node -v

            echo ""
            echo "PNPM:"
            pnpm -v

            echo ""
            echo "PM2:"
            pm2 -v

            echo ""
            echo "========================================"
            echo "DISK BEFORE CLEANUP"
            echo "========================================"

            df -h /

            echo ""
            echo "========================================"
            echo "CURRENT DISK USAGE"
            echo "========================================"

            echo "PNPM store:"
            du -sh "$HOME/.local/share/pnpm/store" 2>/dev/null || true

            echo "GCPR node_modules:"
            du -sh /home/ubuntu/gcpr_backend/node_modules 2>/dev/null || true

            echo "GCPR application:"
            du -sh /home/ubuntu/gcpr_backend 2>/dev/null || true

            echo ""
            echo "========================================"
            echo "CLEANING SAFE CACHE DATA"
            echo "========================================"

            echo "--- Cleaning APT cache ---"
            sudo apt clean || true
            sudo apt autoclean || true

            echo ""
            echo "--- Cleaning old system journals ---"
            sudo journalctl --vacuum-time=3d || true
            sudo journalctl --vacuum-size=100M || true

            echo ""
            echo "--- Removing PNPM store cache ---"
            rm -rf "$HOME/.local/share/pnpm/store"

            echo ""
            echo "PNPM store after cleanup:"
            du -sh "$HOME/.local/share/pnpm" 2>/dev/null || true

            echo ""
            echo "========================================"
            echo "DISK AFTER CACHE CLEANUP"
            echo "========================================"

            df -h /

            AVAILABLE_KB=$(df -Pk / | awk 'NR==2 {print $4}')

            echo ""
            echo "Available disk: ${AVAILABLE_KB} KB"

            if [ "$AVAILABLE_KB" -lt 524288 ]; then
              echo ""
              echo "ERROR: Less than 512 MB is available."
              echo "Stopping deployment."
              exit 1
            fi

            echo ""
            echo "========================================"
            echo "REMOVING OLD GCPR NODE_MODULES"
            echo "========================================"

            if [ -d "/home/ubuntu/gcpr_backend/node_modules" ]; then
              echo "Removing existing GCPR node_modules..."
              rm -rf /home/ubuntu/gcpr_backend/node_modules
            else
              echo "GCPR node_modules does not exist."
            fi

            echo ""
            echo "Disk after removing old node_modules:"
            df -h /

            AVAILABLE_KB=$(df -Pk / | awk 'NR==2 {print $4}')

            if [ "$AVAILABLE_KB" -lt 524288 ]; then
              echo ""
              echo "ERROR: Less than 512 MB is available."
              echo "Stopping deployment."
              exit 1
            fi

            echo ""
            echo "========================================"
            echo "UPDATING BACKEND"
            echo "========================================"

            git fetch origin production
            git checkout production
            git reset --hard origin/production

            echo ""
            echo "========================================"
            echo "INSTALLING DEPENDENCIES"
            echo "========================================"

            pnpm install --frozen-lockfile

            echo ""
            echo "========================================"
            echo "RUNNING DATABASE MIGRATIONS"
            echo "========================================"

            pnpm run migrate:deploy

            echo ""
            echo "========================================"
            echo "RESTARTING BACKEND"
            echo "========================================"

            pm2 restart gcpr-backend --update-env

            echo ""
            echo "========================================"
            echo "CLEANING PNPM STORE AFTER INSTALL"
            echo "========================================"

            pnpm store prune || true

            echo ""
            echo "========================================"
            echo "FINAL DISK STATUS"
            echo "========================================"

            df -h /

            echo ""
            echo "========================================"
            echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
            echo "========================================"