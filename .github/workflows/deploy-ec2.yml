name: Deploy Backend to EC2

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            export PATH="$HOME/.local/share/pnpm:$PATH"

            cd /home/ubuntu/gcpr_backend

            echo "========================================"
            echo "SYSTEM INFORMATION"
            echo "========================================"

            echo "Node:"
            node -v

            echo ""
            echo "PNPM:"
            pnpm -v

            echo ""
            echo "PM2:"
            pm2 -v

            echo ""
            echo "========================================"
            echo "DISK BEFORE CLEANUP"
            echo "========================================"

            df -h /

            echo ""
            echo "========================================"
            echo "TOP-LEVEL DISK USAGE"
            echo "========================================"

            sudo du -xhd1 / 2>/dev/null | sort -h || true

            AVAILABLE_KB=$(df -Pk / | awk 'NR==2 {print $4}')

            echo ""
            echo "Available disk: ${AVAILABLE_KB} KB"

            echo ""
            echo "========================================"
            echo "EMERGENCY CLEANUP"
            echo "========================================"

            if [ "$AVAILABLE_KB" -lt 1048576 ]; then

              echo "WARNING: Less than 1 GB available."
              echo "Running safe cleanup operations..."

              echo ""
              echo "--- Cleaning APT cache ---"
              sudo apt clean || true
              sudo apt autoclean || true

              echo ""
              echo "--- Cleaning old system journals ---"
              sudo journalctl --vacuum-time=3d || true
              sudo journalctl --vacuum-size=100M || true

              echo ""
              echo "--- Cleaning pnpm store ---"
              pnpm store prune || true

            else
              echo "More than 1 GB available."
              echo "No emergency cleanup required."
            fi

            echo ""
            echo "========================================"
            echo "DISK AFTER BASIC CLEANUP"
            echo "========================================"

            df -h /

            echo ""
            echo "========================================"
            echo "DETAILED DISK ANALYSIS"
            echo "========================================"

            echo ""
            echo "--- /home/ubuntu ---"
            sudo du -xhd1 /home/ubuntu 2>/dev/null | sort -h || true

            echo ""
            echo "--- /var ---"
            sudo du -xhd1 /var 2>/dev/null | sort -h || true

            echo ""
            echo "--- /var/log ---"
            sudo du -xhd1 /var/log 2>/dev/null | sort -h || true

            echo ""
            echo "--- /var/lib ---"
            sudo du -xhd1 /var/lib 2>/dev/null | sort -h || true

            echo ""
            echo "--- GCPR BACKEND ---"
            sudo du -xhd1 /home/ubuntu/gcpr_backend 2>/dev/null | sort -h || true

            echo ""
            echo "--- GCPR .git ---"
            sudo du -sh /home/ubuntu/gcpr_backend/.git 2>/dev/null || true

            echo ""
            echo "--- GCPR node_modules ---"
            sudo du -sh /home/ubuntu/gcpr_backend/node_modules 2>/dev/null || true

            echo ""
            echo "--- PNPM STORE ---"
            sudo du -sh /home/ubuntu/.local/share/pnpm 2>/dev/null || true

            echo ""
            echo "--- PM2 ---"
            sudo du -xhd2 /home/ubuntu/.pm2 2>/dev/null | sort -h || true

            echo ""
            echo "--- LARGE FILES OVER 100MB ---"

            sudo find /home /var -xdev -type f -size +100M \
              -printf '%s %p\n' 2>/dev/null \
              | sort -nr \
              | head -30 \
              | awk '{printf "%.1f MB\t%s\n", $1/1024/1024, $2}' || true

            echo ""
            echo "========================================"
            echo "FINAL DISK STATUS"
            echo "========================================"

            df -h /

            AVAILABLE_KB=$(df -Pk / | awk 'NR==2 {print $4}')

            echo ""
            echo "Available disk: ${AVAILABLE_KB} KB"

            echo ""
            echo "========================================"
            echo "DIAGNOSTIC COMPLETE"
            echo "========================================"

            echo "The deployment is intentionally stopping here."
            echo "Review the disk analysis above before removing application data."

            exit 1
