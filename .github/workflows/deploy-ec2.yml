name: Deploy Backend to EC2

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            export PATH="$HOME/.local/share/pnpm:$PATH"

            cd /home/ubuntu/gcpr_backend

            echo "========================================"
            echo "SYSTEM INFORMATION"
            echo "========================================"

            echo "Node:"
            node -v

            echo ""
            echo "PNPM:"
            pnpm -v

            echo ""
            echo "PM2:"
            pm2 -v

            echo ""
            echo "========================================"
            echo "DISK BEFORE CLEANUP"
            echo "========================================"

            df -h /

            echo ""
            echo "========================================"
            echo "CURRENT DISK USAGE"
            echo "========================================"

            echo "PNPM store:"
            du -sh "$HOME/.local/share/pnpm/store" 2>/dev/null || true

            echo "GCPR node_modules:"
            du -sh /home/ubuntu/gcpr_backend/node_modules 2>/dev/null || true

            echo "GCPR application:"
            du -sh /home/ubuntu/gcpr_backend 2>/dev/null || true

            echo ""
            echo "========================================"
            echo "CLEANING SAFE CACHE DATA"
            echo "========================================"

            echo "--- Cleaning APT cache ---"
            sudo apt clean || true
            sudo apt autoclean || true

            echo ""
            echo "--- Cleaning old system journals ---"
            sudo journalctl --vacuum-time=3d || true
            sudo journalctl --vacuum-size=100M || true

            echo ""
            echo "--- Removing PNPM store ---"
            rm -rf "$HOME/.local/share/pnpm/store"

            echo ""
            echo "PNPM directory after cleanup:"
            du -sh "$HOME/.local/share/pnpm" 2>/dev/null || true

            echo ""
            echo "========================================"
            echo "REMOVING OLD GCPR NODE_MODULES"
            echo "========================================"

            if [ -d "/home/ubuntu/gcpr_backend/node_modules" ]; then
              echo "Removing existing GCPR node_modules..."
              rm -rf /home/ubuntu/gcpr_backend/node_modules
            else
              echo "GCPR node_modules does not exist."
            fi

            echo ""
            echo "========================================"
            echo "DISK AFTER CLEANUP"
            echo "========================================"

            df -h /

            AVAILABLE_KB=$(df -Pk / | awk 'NR==2 {print $4}')

            echo ""
            echo "Available disk: ${AVAILABLE_KB} KB"

            # We need enough space to perform git operations and install
            # dependencies. 300 MB is the absolute minimum safety threshold.
            if [ "$AVAILABLE_KB" -lt 307200 ]; then
              echo ""
              echo "ERROR: Less than 300 MB is available after cleanup."
              echo "Stopping deployment to prevent filesystem corruption."
              exit 1
            fi

            echo ""
            echo "========================================"
            echo "UPDATING BACKEND FROM GITHUB"
            echo "========================================"

            git fetch origin production
            git checkout production
            git reset --hard origin/production

            echo ""
            echo "========================================"
            echo "CURRENT COMMIT"
            echo "========================================"

            git log -1 --oneline

            echo ""
            echo "========================================"
            echo "INSTALLING DEPENDENCIES"
            echo "========================================"

            pnpm install --frozen-lockfile

            echo ""
            echo "========================================"
            echo "DISK AFTER DEPENDENCY INSTALL"
            echo "========================================"

            df -h /

            echo ""
            echo "========================================"
            echo "RUNNING DATABASE MIGRATIONS"
            echo "========================================"

            pnpm run migrate:deploy

            echo ""
            echo "========================================"
            echo "RESTARTING BACKEND"
            echo "========================================"

            pm2 restart gcpr-backend --update-env

            echo ""
            echo "========================================"
            echo "VERIFYING BACKEND PROCESS"
            echo "========================================"

            pm2 list

            echo ""
            echo "========================================"
            echo "REMOVING PNPM STORE AFTER INSTALL"
            echo "========================================"

            # PNPM's store is only a cache. The application runs from
            # node_modules, so remove the store after deployment to
            # prevent the 6.7 GB server from filling up again.
            rm -rf "$HOME/.local/share/pnpm/store"

            echo ""
            echo "========================================"
            echo "FINAL DISK STATUS"
            echo "========================================"

            df -h /

            echo ""
            echo "========================================"
            echo "FINAL APPLICATION SIZES"
            echo "========================================"

            echo "GCPR node_modules:"
            du -sh /home/ubuntu/gcpr_backend/node_modules 2>/dev/null || true

            echo ""
            echo "PNPM store:"
            du -sh "$HOME/.local/share/pnpm/store" 2>/dev/null || echo "PNPM store removed"

            echo ""
            echo "========================================"
            echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
            echo "========================================"
